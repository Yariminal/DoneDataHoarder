name: Tests

on:
  push:
    branches: [main, master]
  pull_request:
    branches: [main, master]

jobs:
  test:
    runs-on: ${{ matrix.os }}
    strategy:
      matrix:
        os: [ubuntu-latest, windows-latest, macos-latest]
        python-version: ["3.10", "3.11", "3.12"]

    steps:
      - uses: actions/checkout@v4

      - name: Set up Python ${{ matrix.python-version }}
        uses: actions/setup-python@v5
        with:
          python-version: ${{ matrix.python-version }}

      - name: Install dependencies
        run: |
          python -m pip install --upgrade pip
          pip install -e ".[dev,web]"

      - name: Run tests
        run: pytest tests/ -v --tb=short

      - name: Verify CLI entrypoint
        run: ddh --help

  ui-state:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
      - name: Verify frontend syntax and session settings
        run: |
          node --check donedatahoarder/web/static/app.js
          node tests/ui_setup_session_state.cjs
          node tests/ui_analysis_coverage_state.cjs
          node tests/ui_nonexact_review.cjs
          node tests/ui_dashboard_state.cjs
