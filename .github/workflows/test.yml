name: Tests

on:
  push:
    branches: [main, master]
  pull_request:
    branches: [main, master]

jobs:
  test:
    runs-on: ${{ matrix.os }}
    strategy:
      matrix:
        os: [ubuntu-latest, windows-latest, macos-latest]
        python-version: ["3.10", "3.11", "3.12"]

    steps:
      - uses: actions/checkout@v4

      - name: Set up Python ${{ matrix.python-version }}
        uses: actions/setup-python@v5
        with:
          python-version: ${{ matrix.python-version }}

      - name: Install dependencies
        run: |
          python -m pip install --upgrade pip
          pip install -e ".[dev,web,tui,remote,nearby]"

      - name: Run tests
        run: pytest tests/ -v --tb=short

      - name: Verify CLI entrypoint
        run: |
          ddh --help
          ddh tui --help
          ddh remote-serve --help
          ddh remote-pair --help
          ddh remote-devices --help
          ddh refresh-photos --help

  ui-state:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
      - name: Verify frontend syntax and session settings
        run: |
          node --check donedatahoarder/web/static/app.js
          node tests/ui_setup_session_state.cjs
          node tests/ui_analysis_coverage_state.cjs
          node tests/ui_nonexact_review.cjs
          node tests/ui_photo_review.cjs
          node tests/ui_dashboard_state.cjs
          node tests/ui_review_request_state.cjs
          node tests/ui_relate_progress_state.cjs

  tui-distribution:
    # Minimum TUI Python and Arch's current Python line. Preserve the core's
    # Python 3.10/3.11 jobs above; graphical terminal qualification is separate.
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        python-version: ["3.12", "3.14"]
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: ${{ matrix.python-version }}
      - name: Install build and isolated tool installer
        run: python -m pip install "build>=1.2,<2.0" "uv>=0.8,<1.0"
      - name: Build wheel and source distribution
        run: python -m build
      - name: Test artifacts outside the source checkout
        run: python scripts/check_tui_distribution.py --uv "$(command -v uv)"
      - name: Retain candidate and installation evidence
        uses: actions/upload-artifact@v4
        with:
          name: tui-distribution-python-${{ matrix.python-version }}
          path: dist/
